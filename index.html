<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>الرسائل المشفرة | نشوان البدري</title>
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root {
    --bg-1: #0f172a; --bg-2: #1e293b; --bg-3: #334155;
    --text: #e2e8f0; --text-muted: #94a3b8;
    --accent: #38bdf8; --accent-hover: #7dd3fc;
    --success: #22c55e; --warn: #f59e0b; --danger: #ef4444;
    --card: #1e293b; --border: #334155; --input-bg: #0f172a;
    --shadow: 0 20px 40px -20px rgba(0,0,0,0.6);
  }
  [data-theme="ocean"] { --bg-1: #0c1e2c; --bg-2: #123548; --bg-3: #1e4d68; --accent: #22d3ee; --accent-hover: #67e8f9; --card: #123548; --border: #1e4d68; --input-bg: #0c1e2c; }
  [data-theme="purple"] { --bg-1: #1a0b2e; --bg-2: #2d1b4e; --bg-3: #3f2a63; --accent: #a78bfa; --accent-hover: #c4b5fd; --card: #2d1b4e; --border: #3f2a63; --input-bg: #1a0b2e; }
  [data-theme="emerald"] { --bg-1: #052e16; --bg-2: #0d3d22; --bg-3: #166534; --accent: #34d399; --accent-hover: #6ee7b7; --card: #0d3d22; --border: #166534; --input-bg: #052e16; }
  [data-theme="light"] { --bg-1: #f1f5f9; --bg-2: #ffffff; --bg-3: #e2e8f0; --text: #0f172a; --text-muted: #64748b; --accent: #0284c7; --accent-hover: #0369a1; --card: #ffffff; --border: #cbd5e1; --input-bg: #f8fafc; }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%); color: var(--text); min-height: 100vh; padding: 16px; display: flex; justify-content: center; align-items: flex-start; transition: background 0.4s; }
  .app { width: 100%; max-width: 680px; }
  
  /* شاشة الدخول */
  .login-screen { position: fixed; inset: 0; background: var(--bg-1); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
  .login-box { background: var(--card); padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: var(--shadow); border: 1px solid var(--border); text-align: center; }
  .login-box h2 { color: var(--accent); margin-bottom: 20px; }

  header { text-align: center; margin-bottom: 20px; }
  header h1 { font-size: 24px; color: var(--accent); margin-bottom: 6px; }
  header p { color: var(--text-muted); font-size: 13px; }

  .theme-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
  .theme-btn { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; transition: transform 0.2s; }
  .theme-btn.active { border-color: var(--accent); transform: scale(1.1); }
  .theme-btn[data-th="dark"] { background: linear-gradient(135deg, #0f172a, #38bdf8); }
  .theme-btn[data-th="ocean"] { background: linear-gradient(135deg, #0c1e2c, #22d3ee); }
  .theme-btn[data-th="purple"] { background: linear-gradient(135deg, #1a0b2e, #a78bfa); }
  .theme-btn[data-th="emerald"] { background: linear-gradient(135deg, #052e16, #34d399); }
  .theme-btn[data-th="light"] { background: linear-gradient(135deg, #f1f5f9, #0284c7); }

  .card { background: var(--card); border-radius: 18px; padding: 22px; margin-bottom: 16px; box-shadow: var(--shadow); border: 1px solid var(--border); }
  .card h2 { font-size: 16px; color: var(--accent); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .badge-count { background: var(--accent); color: var(--bg-1); font-size: 11px; padding: 2px 8px; border-radius: 10px; }

  label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; margin-top: 12px; }
  input, textarea, select { width: 100%; padding: 12px 15px; border-radius: 12px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); font-size: 14px; font-family: inherit; transition: 0.2s; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56,189,248,0.15); }
  textarea { min-height: 80px; }

  .btn { padding: 12px 20px; border-radius: 12px; border: none; cursor: pointer; font-size: 14px; font-weight: 600; transition: 0.2s; font-family: inherit; display: inline-flex; justify-content: center; align-items: center; gap: 6px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: var(--bg-1); }
  .btn-success { background: var(--success); color: #fff; }
  .btn-warn { background: var(--warn); color: #0f172a; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .btn-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .btn-row .btn { flex: 1; }

  .output-box { margin-top: 14px; padding: 16px; border-radius: 12px; background: var(--input-bg); border: 1px dashed var(--border); font-family: monospace; font-size: 12px; word-break: break-all; min-height: 55px; color: var(--accent); white-space: pre-wrap; max-height: 200px; overflow-y: auto; }
  .output-box.empty { color: var(--text-muted); font-style: italic; font-family: inherit; }

  .contact-list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .contact-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--input-bg); border-radius: 10px; font-size: 14px; border: 1px solid var(--border); }
  .contact-item .remove { background: var(--danger); color: #fff; border: none; border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 11px; }

  .tabs { display: flex; gap: 6px; margin-bottom: 16px; background: var(--bg-1); padding: 5px; border-radius: 14px; overflow-x: auto; }
  .tab { flex: 1; padding: 10px; border-radius: 10px; border: none; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.2s; white-space: nowrap; }
  .tab.active { background: var(--accent); color: var(--bg-1); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--success); color: #fff; padding: 12px 22px; border-radius: 12px; font-size: 13px; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 9999; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--danger); }

  .designer-badge { text-align: center; padding: 22px; margin-top: 8px; background: linear-gradient(135deg, var(--bg-2), var(--bg-1)); border-radius: 18px; border: 1px solid var(--border); font-size: 13px; color: var(--text-muted); }
  .designer-badge strong { color: var(--accent); font-size: 17px; display: block; margin: 6px 0; }
  .hint { font-size: 11px; color: var(--text-muted); margin-top: 8px; }
  
  #adminSection { display: none; }
</style>
</head>
<body>

<!-- شاشة تسجيل الدخول -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h2>🔐 تسجيل الدخول</h2>
    <label>اسم المستخدم</label>
    <input type="text" id="loginUser" placeholder="أدخل اسم المستخدم">
    <label>كلمة المرور</label>
    <input type="password" id="loginPass" placeholder="أدخل كلمة المرور">
    <button class="btn btn-primary" style="width:100%; margin-top:20px;" id="loginBtn">دخول</button>
    <p class="hint" style="color:var(--danger); margin-top:10px;" id="loginError"></p>
  </div>
</div>

<div class="app" id="mainApp" style="display:none;">
  <header>
    <h1>🔐 الرسائل المشفرة</h1>
    <p>مرحباً، <span id="welcomeUser" style="color:var(--accent); font-weight:bold;"></span></p>
  </header>

  <div class="theme-bar">
    <div class="theme-btn active" data-th="dark"></div>
    <div class="theme-btn" data-th="ocean"></div>
    <div class="theme-btn" data-th="purple"></div>
    <div class="theme-btn" data-th="emerald"></div>
    <div class="theme-btn" data-th="light"></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="encrypt">🔒 تشفير</button>
    <button class="tab" data-tab="decrypt">🔓 فك</button>
    <button class="tab" data-tab="contacts">📇 الأرقام</button>
    <button class="tab" data-tab="settings">⚙️ إعدادات</button>
    <button class="tab" data-tab="admin" id="adminTab" style="display:none;">👑 الإدارة</button>
  </div>

  <!-- تبويب التشفير -->
  <div class="tab-content active" id="tab-encrypt">
    <div class="card">
      <h2>✍️ إنشاء رسالة مشفرة</h2>
      <label>الرقم المرسل إليه (اختياري)</label>
      <select id="recipientSelect"><option value="">— بدون رقم محدد —</option></select>
      <label>الرسالة</label>
      <textarea id="messageInput" placeholder="اكتب رسالتك هنا..."></textarea>
      <label>كلمة مفتاح التشفير</label>
      <input type="password" id="keyInput" placeholder="كلمة السر (اتفق عليها مسبقاً)">
      <div class="btn-row">
        <button class="btn btn-success" id="encryptBtn">🔒 تشفير</button>
        <button class="btn btn-ghost" id="copyBtn" disabled>📋 نسخ</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="shareBtn" disabled>📤 مشاركة</button>
        <button class="btn btn-ghost" id="smsBtn" disabled>📱 SMS</button>
      </div>
      <div class="output-box empty" id="encryptOutput">ستظهر الشيفرة هنا...</div>
    </div>
  </div>

  <!-- تبويب فك التشفير -->
  <div class="tab-content" id="tab-decrypt">
    <div class="card">
      <h2>🔓 ترجمة رسالة مشفرة</h2>
      <label>الصق الشيفرة المستلمة</label>
      <textarea id="cipherInput" placeholder="ENC:..."></textarea>
      <label>كلمة مفتاح التشفير</label>
      <input type="password" id="decryptKeyInput" placeholder="نفس الكلمة المتفق عليها">
      <div class="btn-row">
        <button class="btn btn-warn" id="decryptBtn">🔓 فك التشفير</button>
        <button class="btn btn-ghost" id="clearBtn">🗑️ مسح</button>
      </div>
      <div class="output-box empty" id="decryptOutput">ستظهر الرسالة الأصلية هنا...</div>
    </div>
  </div>

  <!-- تبويب الأرقام -->
  <div class="tab-content" id="tab-contacts">
    <div class="card">
      <h2>📇 الأرقام المحفوظة <span class="badge-count" id="contactCount">0</span></h2>
      <label>اسم الرقم (اختياري)</label>
      <input type="text" id="contactName" placeholder="مثال: أحمد">
      <label>رقم الهاتف</label>
      <input type="tel" id="phoneInput" placeholder="+967771234567">
      <button class="btn btn-primary" style="margin-top:12px; width:100%;" id="addPhoneBtn">+ إضافة رقم</button>
      <div class="contact-list" id="contactList"></div>
    </div>
  </div>

  <!-- تبويب الإعدادات -->
  <div class="tab-content" id="tab-settings">
    <div class="card">
      <h2>⚙️ الإعدادات</h2>
      <div class="btn-row">
        <button class="btn btn-ghost" id="exportBtn">📤 تصدير الأرقام</button>
        <button class="btn btn-ghost" id="importBtn">📥 استيراد</button>
      </div>
      <input type="file" id="importFile" accept=".json" style="display:none;">
      <div class="btn-row">
        <button class="btn btn-danger" id="clearAllBtn">🗑️ حذف كل بياناتي</button>
      </div>
      <div class="btn-row" style="margin-top:20px;">
        <button class="btn btn-warn" id="logoutBtn">🚪 تسجيل الخروج</button>
      </div>
    </div>
  </div>

  <!-- تبويب لوحة التحكم (للمدير فقط) -->
  <div class="tab-content" id="tab-admin">
    <div class="card" id="adminSection">
      <h2>👑 لوحة تحكم المدير</h2>
      <p class="hint" style="margin-bottom:10px;">أضف مستخدمين جدد للدخول إلى التطبيق.</p>
      
      <label>اسم المستخدم الجديد</label>
      <input type="text" id="newUserName" placeholder="مثال: Ahmed">
      
      <label>كلمة المرور</label>
      <input type="password" id="newUserPass" placeholder="كلمة مرور قوية">
      
      <button class="btn btn-primary" style="margin-top:12px; width:100%;" id="addUserBtn">+ إضافة مستخدم</button>
      
      <h2 style="margin-top:20px;">قائمة المستخدمين</h2>
      <div class="contact-list" id="userList"></div>
    </div>
  </div>

  <div class="designer-badge">
    صُمم وبُرمج بعناية بواسطة
    <strong>نشوان البدري</strong>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// تطبيق الرسائل المشفرة — نشوان البدري
// ============================================================

const STORAGE_USERS = "nashwan_users";
const STORAGE_SESSION = "nashwan_session";
const STORAGE_CONTACTS = "nashwan_contacts_"; 
const STORAGE_THEME = "nashwan_theme";

let currentUser = null;
let isAdmin = false;

/* ---------- دوال المساعدة ---------- */
function showToast(msg, isErr = false) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast show" + (isErr ? " error" : "");
  setTimeout(() => t.className = "toast", 2500);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" }[m]));
}

/* ---------- التشفير ---------- */
async function deriveKey(password, salt) {
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: enc.encode(salt), iterations: 120000, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function encryptText(plain, password) {
  const salt = "NASHWAN1"; 
  const key = await deriveKey(password, salt);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(plain));
  const combined = new Uint8Array(8 + 12 + cipher.byteLength);
  combined.set(new TextEncoder().encode(salt), 0);
  combined.set(iv, 8);
  combined.set(new Uint8Array(cipher), 20);
  return "ENC:" + btoa(String.fromCharCode(...combined));
}
async function decryptText(encoded, password) {
  try {
    if (!encoded.startsWith("ENC:")) throw new Error("bad");
    const raw = Uint8Array.from(atob(encoded.slice(4)), c => c.charCodeAt(0));
    const key = await deriveKey(password, new TextDecoder().decode(raw.slice(0, 8)));
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(8, 20) }, key, raw.slice(20));
    return new TextDecoder().decode(plain);
  } catch { return null; }
}

/* ---------- تسجيل الدخول والإدارة ---------- */
function initUsers() {
  let users = JSON.parse(localStorage.getItem(STORAGE_USERS) || "{}");
  // إنشاء حساب المدير NASH افتراضياً إذا لم يكن موجوداً
  if (!users["NASH"]) {
    users["NASH"] = "7717132";
    localStorage.setItem(STORAGE_USERS, JSON.stringify(users));
  }
}

document.getElementById("loginBtn").addEventListener("click", () => {
  const user = document.getElementById("loginUser").value.trim();
  const pass = document.getElementById("loginPass").value.trim();
  const users = JSON.parse(localStorage.getItem(STORAGE_USERS) || "{}");
  
  if (users[user] && users[user] === pass) {
    currentUser = user;
    isAdmin = (user === "NASH");
    localStorage.setItem(STORAGE_SESSION, user);
    startApp();
  } else {
    document.getElementById("loginError").textContent = "اسم المستخدم أو كلمة المرور غير صحيحة";
  }
});

document.getElementById("logoutBtn").addEventListener("click", () => {
  localStorage.removeItem(STORAGE_SESSION);
  location.reload();
});

function startApp() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("mainApp").style.display = "block";
  document.getElementById("welcomeUser").textContent = currentUser;
  
  if (isAdmin) {
    document.getElementById("adminTab").style.display = "block";
    document.getElementById("adminSection").style.display = "block";
    renderUsers();
  }
  
  applyTheme(localStorage.getItem(STORAGE_THEME) || "dark");
  renderContacts();
}

/* ---------- إدارة المستخدمين (للمدير) ---------- */
function renderUsers() {
  const users = JSON.parse(localStorage.getItem(STORAGE_USERS) || "{}");
  const list = document.getElementById("userList");
  list.innerHTML = "";
  
  for (let u in users) {
    const div = document.createElement("div");
    div.className = "contact-item";
    div.innerHTML = `<span>👤 ${escapeHtml(u)}</span>`;
    if (u !== "NASH") {
      const btn = document.createElement("button");
      btn.className = "remove"; btn.textContent = "حذف";
      btn.onclick = () => {
        delete users[u];
        localStorage.setItem(STORAGE_USERS, JSON.stringify(users));
        renderUsers(); showToast("تم حذف المستخدم");
      };
      div.appendChild(btn);
    } else {
      div.innerHTML += `<span style="font-size:11px; color:var(--accent);">(مدير)</span>`;
    }
    list.appendChild(div);
  }
}

document.getElementById("addUserBtn").addEventListener("click", () => {
  const u = document.getElementById("newUserName").value.trim();
  const p = document.getElementById("newUserPass").value.trim();
  if (!u || !p) return showToast("أدخل الاسم وكلمة المرور", true);
  
  let users = JSON.parse(localStorage.getItem(STORAGE_USERS) || "{}");
  if (users[u]) return showToast("المستخدم موجود مسبقاً", true);
  
  users[u] = p;
  localStorage.setItem(STORAGE_USERS, JSON.stringify(users));
  document.getElementById("newUserName").value = "";
  document.getElementById("newUserPass").value = "";
  renderUsers(); showToast("✅ تم إضافة المستخدم");
});

/* ---------- الأرقام (خاصة بكل مستخدم) ---------- */
function getUserContactsKey() { return STORAGE_CONTACTS + currentUser; }

function loadContacts() {
  try { return JSON.parse(localStorage.getItem(getUserContactsKey()) || "[]"); } catch { return []; }
}
function saveContacts(list) { localStorage.setItem(getUserContactsKey(), JSON.stringify(list)); }

function renderContacts() {
  const contacts = loadContacts();
  const list = document.getElementById("contactList");
  const select = document.getElementById("recipientSelect");
  list.innerHTML = "";
  select.innerHTML = '<option value="">— بدون رقم محدد —</option>';
  document.getElementById("contactCount").textContent = contacts.length;

  contacts.forEach((c, idx) => {
    const div = document.createElement("div");
    div.className = "contact-item";
    div.innerHTML = `<div><div style="font-weight:600; font-size:13px;">${escapeHtml(c.name || "بدون اسم")}</div><div style="font-size:12px; color:var(--text-muted);">${escapeHtml(c.number)}</div></div>`;
    
    const rm = document.createElement("button");
    rm.className = "remove"; rm.textContent = "حذف";
    rm.onclick = () => { const u = loadContacts(); u.splice(idx, 1); saveContacts(u); renderContacts(); };
    div.appendChild(rm);
    list.appendChild(div);

    const opt = document.createElement("option");
    opt.value = c.number;
    opt.textContent = (c.name ? c.name + " — " : "") + c.number;
    select.appendChild(opt);
  });
}

document.getElementById("addPhoneBtn").addEventListener("click", () => {
  const num = document.getElementById("phoneInput").value.trim();
  const name = document.getElementById("contactName").value.trim();
  if (!num) return showToast("أدخل رقماً", true);
  const contacts = loadContacts();
  if (contacts.some(c => c.number === num)) return showToast("الرقم مضاف مسبقاً", true);
  contacts.push({ name, number: num });
  saveContacts(contacts);
  document.getElementById("phoneInput").value = ""; document.getElementById("contactName").value = "";
  renderContacts(); showToast("✅ تمت الإضافة");
});

/* ---------- التشفير من الواجهة ---------- */
document.getElementById("encryptBtn").addEventListener("click", async () => {
  const msg = document.getElementById("messageInput").value.trim();
  const key = document.getElementById("keyInput").value;
  if (!msg) return showToast("اكتب الرسالة", true);
  if (!key || key.length < 4) return showToast("كلمة المفتاح 4 أحرف على الأقل", true);

  const btn = document.getElementById("encryptBtn");
  btn.disabled = true; btn.textContent = "⏳...";
  try {
    const cipher = await encryptText(msg, key);
    const out = document.getElementById("encryptOutput");
    out.classList.remove("empty"); out.textContent = cipher;
    ["copyBtn", "shareBtn", "smsBtn"].forEach(id => document.getElementById(id).disabled = false);
    showToast("✅ تم التشفير");
  } catch { showToast("خطأ في التشفير", true); }
  finally { btn.disabled = false; btn.textContent = "🔒 تشفير"; }
});

document.getElementById("copyBtn").addEventListener("click", async () => {
  const txt = document.getElementById("encryptOutput").textContent;
  if (!txt || document.getElementById("encryptOutput").classList.contains("empty")) return;
  try { await navigator.clipboard.writeText(txt); showToast("📋 تم النسخ"); } catch { showToast("فشل النسخ", true); }
});

document.getElementById("shareBtn").addEventListener("click", async () => {
  const txt = document.getElementById("encryptOutput").textContent;
  if (navigator.share) { try { await navigator.share({ title: "رسالة مشفرة", text: txt }); } catch {} }
  else { await navigator.clipboard.writeText(txt); showToast("تم النسخ — الصقه في أي تطبيق"); }
});

document.getElementById("smsBtn").addEventListener("click", () => {
  const txt = document.getElementById("encryptOutput").textContent;
  const rec = document.getElementById("recipientSelect").value;
  if (!txt) return;
  window.location.href = `sms:${rec}?body=${encodeURIComponent(txt)}`;
});

/* ---------- فك التشفير ---------- */
document.getElementById("decryptBtn").addEventListener("click", async () => {
  const cipher = document.getElementById("cipherInput").value.trim();
  const key = document.getElementById("decryptKeyInput").value;
  if (!cipher || !key) return showToast("أدخل الشيفرة والمفتاح", true);

  const btn = document.getElementById("decryptBtn");
  btn.disabled = true; btn.textContent = "⏳...";
  const res = await decryptText(cipher, key);
  const out = document.getElementById("decryptOutput");
  out.classList.remove("empty");
  
  if (res === null) { out.textContent = "❌ تعذر الفك — تحقق من المفتاح أو الشيفرة"; out.style.color = "var(--danger)"; showToast("فشل الفك", true); }
  else { out.textContent = res; out.style.color = "var(--success)"; showToast("✅ تم الفك"); }
  
  btn.disabled = false; btn.textContent = "🔓 فك التشفير";
});

document.getElementById("clearBtn").addEventListener("click", () => {
  document.getElementById("cipherInput").value = ""; document.getElementById("decryptKeyInput").value = "";
  const out = document.getElementById("decryptOutput");
  out.textContent = "ستظهر الرسالة الأصلية هنا..."; out.classList.add("empty"); out.style.color = "var(--accent)";
});

/* ---------- الثيمات والتبويبات ---------- */
function applyTheme(name) {
  if (name === "dark") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", name);
  document.querySelectorAll(".theme-btn").forEach(b => b.classList.toggle("active", b.dataset.th === name));
  localStorage.setItem(STORAGE_THEME, name);
}
document.querySelectorAll(".theme-btn").forEach(b => b.addEventListener("click", () => applyTheme(b.dataset.th)));

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById("tab-" + tab.dataset.tab).classList.add("active");
  });
});

/* ---------- تصدير/استيراد ---------- */
document.getElementById("exportBtn").addEventListener("click", () => {
  const data = JSON.stringify(loadContacts(), null, 2);
  const blob = new Blob([data], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = "contacts.json"; a.click();
  URL.revokeObjectURL(url);
});
document.getElementById("importBtn").addEventListener("click", () => document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change", (e) => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!Array.isArray(data)) throw new Error();
      const merged = [...loadContacts()];
      data.forEach(c => { if (c.number && !merged.some(m => m.number === c.number)) merged.push(c); });
      saveContacts(merged); renderContacts(); showToast("📥 تم الاستيراد");
    } catch { showToast("ملف غير صالح", true); }
  };
  reader.readAsText(file); document.getElementById("importFile").value = "";
});
document.getElementById("clearAllBtn").addEventListener("click", () => {
  if (!confirm("سيتم حذف أرقامك. متأكد؟")) return;
  localStorage.removeItem(getUserContactsKey()); renderContacts(); showToast("🗑️ تم الحذف");
});

/* ---------- بدء التشغيل ---------- */
initUsers();
const savedSession = localStorage.getItem(STORAGE_SESSION);
if (savedSession) {
  currentUser = savedSession;
  isAdmin = (currentUser === "NASH");
  startApp();
}
</script>
</body>
