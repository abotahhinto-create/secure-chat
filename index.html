<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>واتساب نشوان الآمن</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial}
body{margin:0;background:#f0f2f5;color:#111b21;direction:rtl}
.hidden{display:none!important}
.screen{min-height:100vh}
#loginScreen{display:flex;align-items:center;justify-content:center;background:#075e54;padding:20px}
.login-card{background:#fff;width:100%;max-width:380px;padding:28px;border-radius:18px;text-align:center}
.logo{font-size:55px}
.login-card input{width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:10px;font-size:16px}
.login-card button{width:100%;padding:13px;background:#25d366;border:none;color:#fff;border-radius:10px;font-size:17px;font-weight:bold;cursor:pointer;margin-top:8px}
.top-header{background:#fff;padding:12px 14px 8px;position:sticky;top:0;z-index:10;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.header-row{display:flex;justify-content:space-between;align-items:center}
.header-row h2{margin:0;font-size:28px;font-weight:800;color:#075e54}
.header-icons span{font-size:22px;margin:0 8px;cursor:pointer}
.search-box{display:flex;background:#f0f2f5;border-radius:22px;padding:9px 14px;margin:10px 0}
.search-box input{flex:1;border:none;background:transparent;outline:none;font-size:15px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.filter{white-space:nowrap;border:none;background:#f0f2f5;padding:7px 14px;border-radius:18px;cursor:pointer;font-size:14px}
.filter.active{background:#d9fdd3;color:#075e54;font-weight:bold}
.filter.plus{background:#075e54;color:#fff;font-size:18px}
#chatList{padding-bottom:90px}
.chat-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border-bottom:1px solid #f0f2f5;cursor:pointer}
.chat-item img{width:52px;height:52px;border-radius:50%;object-fit:cover}
.chat-info{flex:1;min-width:0}
.chat-info b{font-size:16px;display:flex;gap:6px;align-items:center}
.chat-info p{margin:4px 0 0;color:#667781;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-meta{text-align:left;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.chat-meta small{color:#25d366;font-size:12px}
.unread-badge{background:#25d366;color:#fff;min-width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;padding:0 5px}
.group-badge{background:#eef6ff;color:#075e54;font-size:11px;padding:2px 7px;border-radius:10px}
.installed{color:#25d366;font-size:12px}
.not-installed{color:#999;font-size:12px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #eee;padding:6px 0 8px;z-index:20}
.nav-btn{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:#667781}
.nav-btn.active{color:#075e54;font-weight:bold}
.nav-btn span{font-size:22px}
.fab{position:fixed;bottom:85px;left:16px;width:52px;height:52px;border-radius:50%;background:#25d366;color:#fff;border:none;font-size:26px;box-shadow:0 4px 12px rgba(0,0,0,.25);cursor:pointer;z-index:15}
.panel{position:fixed;inset:0;background:#fff;z-index:30;padding:18px;overflow:auto}
.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tool-grid button{padding:14px;border:1px solid #eee;background:#f8f9fa;border-radius:12px;cursor:pointer;font-size:15px}
.close-panel{width:100%;padding:12px;background:#075e54;color:#fff;border:none;border-radius:10px}
#chatScreen{display:flex;flex-direction:column;height:100vh;background:#efeae2}
.chat-header{background:#075e54;color:#fff;display:flex;align-items:center;gap:10px;padding:10px}
.chat-header button{background:none;border:none;color:#fff;font-size:22px;cursor:pointer}
.chat-header img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.chat-head-info{flex:1}
.chat-head-info small{opacity:.85}
.chat-head-actions span{font-size:20px;margin:0 6px;cursor:pointer}
.encrypt-bar{background:#fff3cd;padding:8px 12px;display:flex;justify-content:space-between;font-size:13px;border-bottom:1px solid #ffe69c}
.encrypt-bar.encrypted{background:#d1e7dd}
#messagesArea{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:9px 12px;border-radius:12px;font-size:15px;line-height:1.5;position:relative;word-break:break-word}
.msg.me{align-self:flex-start;background:#d9fdd3}
.msg.other{align-self:flex-end;background:#fff}
.msg img{max-width:100%;border-radius:10px;display:block;margin-bottom:5px}
.msg small{display:block;text-align:left;font-size:11px;color:#667781;margin-top:4px}
.msg-input{display:flex;gap:8px;padding:10px;background:#fff;align-items:center}
#msgInput{flex:1;border:none;background:#f0f2f5;padding:12px 14px;border-radius:22px;outline:none;font-size:15px}
.msg-input button{background:#25d366;color:#fff;border:none;width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer}
.attach{font-size:20px;cursor:pointer}
.chat-menu{background:#fff;padding:8px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.chat-menu button{display:block;width:100%;text-align:right;padding:11px;border:none;background:none;cursor:pointer}
.call-banner{background:#075e54;color:#fff;padding:10px;display:flex;justify-content:space-between;align-items:center}
.call-banner button{background:#ff3b30;color:#fff;border:none;padding:7px 12px;border-radius:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-box{background:#fff;width:100%;max-width:430px;max-height:90vh;overflow:auto;border-radius:16px;padding:18px}
.stats{display:flex;gap:10px;text-align:center;margin:12px 0}
.stats div{flex:1;background:#f0f2f5;padding:12px;border-radius:12px;display:flex;flex-direction:column}
.modal-box button{width:100%;padding:11px;margin:5px 0;border:1px solid #ddd;background:#f8f9fa;border-radius:10px;cursor:pointer}
.modal-box button.primary{background:#25d366;color:#fff;border:none}
.modal-box input{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin:5px 0}
.contact-row{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #eee}
body[data-theme="desert"] #chatScreen{background:#e8ddd0}
body[data-theme="dark"]{background:#0b141a;color:#e9edef}
body[data-theme="dark"] .top-header,body[data-theme="dark"] .chat-item,body[data-theme="dark"] .bottom-nav{background:#111b21;color:#e9edef}
</style>
</head>
<body>

<div id="loginScreen" class="screen">
  <div class="login-card">
    <div class="logo">🛡️</div>
    <h1>واتساب نشوان الآمن</h1>
    <p>دخول آمن - مرة واحدة فقط</p>
    <input id="myName" placeholder="اسمك مثلاً: نشوان">
    <input id="myPhone" placeholder="رقمك مثلاً: 770385943" type="tel">
    <input id="myPass" placeholder="كلمة مرور (اختياري)" type="password">
    <button onclick="doLogin()">دخول للمحادثات →</button>
    <small>بتدخل مرة واحدة، وبعدها بيفتح على طول بدون كلمة مرور</small>
    <div id="inviteInfo"></div>
  </div>
</div>

<div id="appScreen" class="screen hidden">
  <header class="top-header">
    <div class="header-row">
      <h2>واتساب</h2>
      <div class="header-icons"><span onclick="openCamera()">📷</span><span onclick="showMenu()">⋮</span></div>
    </div>
    <div class="search-box"><input id="searchInput" placeholder="بحث..." oninput="renderChats()"><span>🔍</span></div>
    <div class="filters">
      <button class="filter active" onclick="setFilter('all',this)">الكل</button>
      <button class="filter" onclick="setFilter('unread',this)">غير مقروءة <b id="unreadCount"></b></button>
      <button class="filter" onclick="setFilter('fav',this)">المفضلة</button>
      <button class="filter" onclick="setFilter('groups',this)">المجموعات <b id="groupCount"></b></button>
      <button class="filter plus" onclick="openNewChat()">+</button>
    </div>
  </header>
  <main id="chatList"></main>
  <button class="fab" onclick="openNewChat()">+</button>
  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('chats',this)"><span>💬</span><small>الدردشات</small></button>
    <button class="nav-btn" onclick="switchTab('calls',this)"><span>📞</span><small>المكالمات</small></button>
    <button class="nav-btn" onclick="switchTab('status',this)"><span>⭕</span><small>التحديثات</small></button>
    <button class="nav-btn" onclick="switchTab('tools',this)"><span>🛠️</span><small>الأدوات</small></button>
  </nav>
  <div id="toolsPanel" class="panel hidden">
    <h3>🛠️ الأدوات</h3>
    <div class="tool-grid">
      <button onclick="openDashboard()">👑 لوحة التحكم</button>
      <button onclick="openThemes()">🎨 الثيمات</button>
      <button onclick="openContacts()">👥 جهات الاتصال</button>
      <button onclick="openSettings()">⚙️ الإعدادات</button>
      <button onclick="generateInvite()">🔗 توليد رابط دعوة</button>
      <button onclick="lockApp()">🔒 قفل التطبيق</button>
    </div>
    <div id="toolsContent"></div>
    <button class="close-panel" onclick="switchTab('chats',document.querySelectorAll('.nav-btn')[0])">رجوع للمحادثات</button>
  </div>
</div>

<div id="chatScreen" class="screen hidden">
  <header class="chat-header">
    <button onclick="closeChat()">→</button>
    <img id="chatAvatar" src="">
    <div class="chat-head-info"><b id="chatName"></b><br><small id="chatStatus">متصل الآن</small></div>
    <div class="chat-head-actions"><span onclick="startCall()">📞</span><span onclick="startVideo()">📹</span><span onclick="toggleChatMenu()">⋮</span></div>
  </header>
  <div class="encrypt-bar"><label><input type="checkbox" id="encryptToggle" onchange="toggleEncrypt()"> 🔒 ترميز هذه المحادثة (اختياري)</label><span id="encryptState">غير مرمزة</span></div>
  <div id="chatMenu" class="chat-menu hidden">
    <button onclick="toggleEncryptFromMenu()">🔒 ترميز / فك ترميز</button>
    <button onclick="toggleFavCurrent()">⭐ إضافة للمفضلة</button>
    <button onclick="muteCurrent()">🔕 كتم</button>
    <button onclick="clearCurrent()">🗑️ حذف المحادثة</button>
  </div>
  <main id="messagesArea"></main>
  <div id="callBanner" class="call-banner hidden"><b id="callText">📞 مكالمة جارية...</b><button onclick="endCall()">إنهاء ❌</button></div>
  <footer class="msg-input">
    <label class="attach">📎<input type="file" accept="image/*" onchange="sendImage(event)" hidden></label>
    <label class="attach">📷<input type="file" accept="image/*" capture="camera" onchange="sendImage(event)" hidden></label>
    <input id="msgInput" placeholder="اكتب رسالة..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">➤</button>
  </footer>
</div>

<div id="dashboardModal" class="modal hidden">
  <div class="modal-box">
    <h3>👑 لوحة تحكم أمن البلاد</h3>
    <div class="stats"><div><b id="statTotal">0</b><small>مواطن</small></div><div><b id="statInstalled">0</b><small>مثبت</small></div><div><b id="statOnline">0</b><small>متصل</small></div></div>
    <button class="primary" onclick="generateInvite()">🔗 توليد رابط دعوة جديد</button>
    <input id="inviteLink" readonly placeholder="رابط الدعوة بيظهر هنا">
    <button onclick="copyInvite()">نسخ الرابط</button>
    <h4>المواطنين - تفعيل / إلغاء</h4><div id="adminUsers"></div>
    <h4>الثيمات</h4><div id="adminThemes"></div>
    <button onclick="closeDashboard()">إغلاق</button>
  </div>
</div>

<script>
const BC=new BroadcastChannel('nashwan-chat');
let me=JSON.parse(localStorage.getItem('nashwan_me')||'null');
let chats=JSON.parse(localStorage.getItem('nashwan_chats')||'[]');
let currentFilter='all',currentChatId=null,localStream=null;
const defaultContacts=[
 {id:'c1',name:'البدري',phone:'967770385943',avatar:'https://i.pravatar.cc/100?img=12',installed:true},
 {id:'c2',name:'رشاد',phone:'967777123456',avatar:'https://i.pravatar.cc/100?img=32',installed:true},
 {id:'c3',name:'محمد',phone:'967733987654',avatar:'https://i.pravatar.cc/100?img=5',installed:false},
];
function save(){localStorage.setItem('nashwan_chats',JSON.stringify(chats));localStorage.setItem('nashwan_me',JSON.stringify(me));}
function doLogin(){const name=document.getElementById('myName').value.trim()||'نشوان';const phone=document.getElementById('myPhone').value.trim()||'967770385943';me={name,phone,pass:document.getElementById('myPass').value,installed:true,loginAt:Date.now()};save();showApp();}
function lockApp(){localStorage.removeItem('nashwan_me');me=null;location.reload();}
function showApp(){
 if(!me){document.getElementById('loginScreen').classList.remove('hidden');return;}
 document.getElementById('loginScreen').classList.add('hidden');document.getElementById('appScreen').classList.remove('hidden');
 defaultContacts.forEach(c=>{if(!chats.find(x=>x.phone===c.phone)) chats.push({id:'chat_'+c.id,phone:c.phone,name:c.name,avatar:c.avatar,installed:c.installed,type:'chat',fav:false,encrypted:false,messages:[],unread:0});});
 const params=new URLSearchParams(location.search); if(params.get('invite')) document.getElementById('inviteInfo').innerHTML='تم دعوتك عبر رابط دعوة ✅';
 save();renderChats();
}
function setFilter(f,el){currentFilter=f;document.querySelectorAll('.filter').forEach(b=>b.classList.remove('active'));el.classList.add('active');renderChats();}
function switchTab(tab,btn){document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');const tools=document.getElementById('toolsPanel');if(tab==='tools'){tools.classList.remove('hidden');}else{tools.classList.add('hidden');if(tab==='calls') openCalls();if(tab==='status') alert('التحديثات - الحالات قريباً');if(tab==='chats') renderChats();}}
function renderChats(){
 const q=(document.getElementById('searchInput')?.value||'').toLowerCase();
 let list=chats.filter(c=>{if(currentFilter==='unread'&&!c.unread) return false;if(currentFilter==='fav'&&!c.fav) return false;if(currentFilter==='groups'&&c.type!=='group') return false;if(q&&!c.name.toLowerCase().includes(q)) return false;return true;});
 document.getElementById('unreadCount').textContent=chats.reduce((s,c)=>s+(c.unread||0),0)||'';
 document.getElementById('groupCount').textContent=chats.filter(c=>c.type==='group').length||'';
 const el=document.getElementById('chatList');
 if(!list.length){el.innerHTML='<div style="text-align:center;padding:40px;color:#888">لا توجد محادثات بعد<br><button onclick="openNewChat()" style="margin-top:10px;padding:10px 18px;background:#25d366;color:#fff;border:none;border-radius:10px">+ محادثة جديدة</button></div>';return;}
 el.innerHTML=list.map(c=>{const last=c.messages[c.messages.length-1];let lastText=last?(last.image?'📷 صورة':last.encrypted?'🔒 رسالة مرمزة':last.text):'ابدأ المحادثة...';return `<div class="chat-item" onclick="openChat('${c.id}')"><img src="${c.avatar}"><div class="chat-info"><b>${c.name} ${c.type==='group'?'<span class="group-badge">مجموعة</span>':''} ${c.fav?'⭐':''}</b><p>${lastText}</p><small class="${c.installed?'installed':'not-installed'}">${c.type==='group'?'👥 '+(c.members?.length||0)+' عضو':c.installed?'✅ مثبت التطبيق':'⚪ مش مثبت - اضغط لدعوته'}</small></div><div class="chat-meta"><small>${last?new Date(last.time).toLocaleTimeString('ar-YE',{hour:'2-digit',minute:'2-digit'}):''}</small>${c.unread?`<span class="unread-badge">${c.unread}</span>`:''}<span>✅✅</span></div></div>`;}).join('');
}
function openChat(id){currentChatId=id;const c=chats.find(x=>x.id===id);if(!c) return;c.unread=0;save();document.getElementById('appScreen').classList.add('hidden');document.getElementById('chatScreen').classList.remove('hidden');document.getElementById('chatName').textContent=c.name;document.getElementById('chatAvatar').src=c.avatar;document.getElementById('chatStatus').textContent=c.installed?'متصل الآن - مثبت التطبيق':'مش مثبت التطبيق';document.getElementById('encryptToggle').checked=!!c.encrypted;updateEncryptUI();renderMessages();}
function closeChat(){document.getElementById('chatScreen').classList.add('hidden');document.getElementById('appScreen').classList.remove('hidden');currentChatId=null;renderChats();}
function renderMessages(){const c=chats.find(x=>x.id===currentChatId);if(!c) return;const area=document.getElementById('messagesArea');area.innerHTML=c.messages.map(m=>{let content=m.image?`<img src="${m.image}">`:`<span>${m.encrypted?decodeURIComponent(escape(atob(m.text))):m.text}</span>`;return `<div class="msg ${m.fromMe?'me':'other'}">${content}<small>${new Date(m.time).toLocaleTimeString('ar-YE',{hour:'2-digit',minute:'2-digit'})} ${m.fromMe?'✅✅':''}</small></div>`;}).join('')||'<div style="text-align:center;color:#888;margin-top:40px">ابدأ المحادثة مع '+c.name+'</div>';area.scrollTop=area.scrollHeight;}
function sendMessage(){const inp=document.getElementById('msgInput');const text=inp.value.trim();if(!text) return;const c=chats.find(x=>x.id===currentChatId);const msg={text:c.encrypted?btoa(unescape(encodeURIComponent(text))):text,fromMe:true,time:Date.now(),encrypted:!!c.encrypted,chatId:c.id};c.messages.push(msg);save();inp.value='';renderMessages();BC.postMessage({type:'new-msg',chatPhone:c.phone,msg:{...msg,fromMe:false}});}
function sendImage(e){const file=e.target.files[0];if(!file) return;const reader=new FileReader();reader.onload=()=>{const c=chats.find(x=>x.id===currentChatId);const msg={image:reader.result,fromMe:true,time:Date.now(),chatId:c.id};c.messages.push(msg);save();renderMessages();BC.postMessage({type:'new-msg',chatPhone:c.phone,msg:{...msg,fromMe:false}});};reader.readAsDataURL(file);}
BC.onmessage=(ev)=>{if(ev.data.type==='new-msg'){let c=chats.find(x=>x.phone===ev.data.chatPhone);if(!c){c={id:'chat_'+Date.now(),phone:ev.data.chatPhone,name:ev.data.chatPhone,avatar:'https://i.pravatar.cc/100?img=1',installed:true,type:'chat',messages:[],unread:0};chats.push(c);}c.messages.push(ev.data.msg);if(currentChatId!==c.id) c.unread=(c.unread||0)+1;save();renderChats();if(currentChatId===c.id) renderMessages();}if(ev.data.type==='call'){alert('📞 مكالمة واردة من '+ev.data.from);showIncomingCall(ev.data.from);}};
function toggleEncrypt(){const c=chats.find(x=>x.id===currentChatId);c.encrypted=document.getElementById('encryptToggle').checked;save();updateEncryptUI();}
function toggleEncryptFromMenu(){const box=document.getElementById('encryptToggle');box.checked=!box.checked;toggleEncrypt();document.getElementById('chatMenu').classList.add('hidden');}
function toggleChatMenu(){document.getElementById('chatMenu').classList.toggle('hidden');}
function updateEncryptUI(){const c=chats.find(x=>x.id===currentChatId);if(!c) return;const bar=document.querySelector('.encrypt-bar');bar.classList.toggle('encrypted',!!c.encrypted);document.getElementById('encryptState').textContent=c.encrypted?'🔒 مرمزة':'غير مرمزة';}
function toggleFavCurrent(){const c=chats.find(x=>x.id===currentChatId);c.fav=!c.fav;save();alert(c.fav?'تمت الإضافة للمفضلة ⭐':'تمت الإزالة من المفضلة');}
function muteCurrent(){alert('تم كتم المحادثة 🔕');}
function clearCurrent(){const c=chats.find(x=>x.id===currentChatId);c.messages=[];save();renderMessages();}
function openNewChat(){const name=prompt('اسم الشخص أو المجموعة:');if(!name) return;const isGroup=confirm('هل هذه مجموعة؟ موافق = مجموعة، إلغاء = محادثة فردية');const phone=prompt('رقم الشخص:','96777')||'96777'+Math.floor(Math.random()*1000000);const newChat={id:'chat_'+Date.now(),name,phone,avatar:'https://i.pravatar.cc/100?img='+Math.floor(Math.random()*60),installed:Math.random()>0.4,type:isGroup?'group':'chat',members:isGroup?[me?.phone]:[],messages:[],unread:0};chats.unshift(newChat);save();renderChats();openChat(newChat.id);}
function openContacts(){document.getElementById('toolsContent').innerHTML='<h4>جهات الاتصال - مدمجة</h4>'+chats.map(c=>`<div class="contact-row"><span>${c.name} - ${c.phone}<br><small class="${c.installed?'installed':'not-installed'}">${c.installed?'✅ مثبت':'⚪ مش مثبت'}</small></span><button onclick="openChat('${c.id}')" style="width:auto;padding:7px 12px">مراسلة</button></div>`).join('');}
function openThemes(){document.getElementById('toolsContent').innerHTML=`<h4>🎨 الثيمات</h4><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button onclick="setTheme('default')">🌿 الأخضر الرسمي</button><button onclick="setTheme('desert')">🏜️ رملي</button><button onclick="setTheme('dark')">🌙 ليلي</button><button onclick="setTheme('blue')">⚓ أزرق</button></div>`;}
function setTheme(t){document.body.setAttribute('data-theme',t);localStorage.setItem('nashwan_theme',t);alert('تم تطبيق الثيم ✅');}
function openSettings(){document.getElementById('toolsContent').innerHTML=`<h4>⚙️ الإعدادات</h4><p>الاسم: ${me?.name}</p><p>الرقم: ${me?.phone}</p><button onclick="lockApp()">تسجيل خروج / طلب كلمة مرور من جديد</button><button onclick="if(confirm('حذف كل المحادثات؟')){chats=[];save();renderChats();}">حذف كل المحادثات</button>`;}
function openDashboard(){document.getElementById('dashboardModal').classList.remove('hidden');renderDashboard();}
function closeDashboard(){document.getElementById('dashboardModal').classList.add('hidden');}
function renderDashboard(){document.getElementById('statTotal').textContent=chats.length;document.getElementById('statInstalled').textContent=chats.filter(c=>c.installed).length;document.getElementById('statOnline').textContent=1;document.getElementById('adminUsers').innerHTML=chats.map(c=>`<div class="contact-row"><span>${c.name} - ${c.phone} <small>${c.installed?'✅ مثبت':'⚪ مش مثبت'}</small></span><button style="width:auto" onclick="toggleUser('${c.id}')">${c.installed?'إلغاء ❌':'تفعيل ✅'}</button></div>`).join('');document.getElementById('adminThemes').innerHTML='<button onclick="setTheme(\'default\')">الأخضر الرسمي</button><button onclick="setTheme(\'dark\')">ليلي</button>';}
function toggleUser(id){const c=chats.find(x=>x.id===id);c.installed=!c.installed;save();renderDashboard();renderChats();}
function generateInvite(){const code=Math.random().toString(36).substring(2,8).toUpperCase();const link=location.origin+location.pathname+'?invite='+code;document.getElementById('inviteLink').value=link;if(document.getElementById('toolsContent')) document.getElementById('toolsContent').innerHTML='<p>رابط الدعوة:</p><input value="'+link+'" readonly><button onclick="copyInvite()">نسخ</button><small>أي واحد يضغط عليه بيدخل ويسجل تلقائي</small>';return link;}
function copyInvite(){const i=document.getElementById('inviteLink');i.select();navigator.clipboard.writeText(i.value);alert('تم نسخ رابط الدعوة ✅');}
async function startCall(){try{localStream=await navigator.mediaDevices.getUserMedia({audio:true});document.getElementById('callBanner').classList.remove('hidden');document.getElementById('callText').textContent='📞 مكالمة صوتية جارية مع '+document.getElementById('chatName').textContent+' - يسمعك الآن';BC.postMessage({type:'call',from:me?.name||'نشوان'});const audio=document.createElement('audio');audio.srcObject=localStream;audio.play();}catch(e){alert('اسمح للميكروفون عشان المكالمة تشتغل، وافتح من https');}}
function showIncomingCall(from){document.getElementById('callBanner')?.classList.remove('hidden');if(document.getElementById('callText')) document.getElementById('callText').textContent='📞 مكالمة واردة من '+from;}
function endCall(){if(localStream) localStream.getTracks().forEach(t=>t.stop());document.getElementById('callBanner').classList.add('hidden');}
function startVideo(){alert('مكالمة فيديو - اسمح للكاميرا');startCall();}
function openCamera(){alert('الكاميرا - اختر صورة من المحادثة');}
function showMenu(){alert('القائمة: لوحة تحكم - إعدادات - أذكار');}
function openCalls(){document.getElementById('chatList').innerHTML='<div style="padding:30px;text-align:center">📞 سجل المكالمات<br><small>المكالمات الصوتية والفيديو داخل التطبيق</small><br><br><button onclick="renderChats()" style="padding:10px 18px;background:#075e54;color:#fff;border:none;border-radius:10px">رجوع للمحادثات</button></div>';}
if(localStorage.getItem('nashwan_theme')) document.body.setAttribute('data-theme',localStorage.getItem('nashwan_theme'));
showApp();
</script>
</body>
</html>
