<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المدير - واتساب نشوان</title>
<style>
  *{box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
  body{margin:0;background:#0b141a;color:#fff;display:flex;justify-content:center;min-height:100vh}
  .app{width:100%;max-width:420px;background:#111b21;min-height:100vh;padding:20px}
  .card{background:#202c33;border-radius:12px;padding:18px;margin-bottom:15px}
  .card h3{margin:0 0 5px 0;color:#00a884}
  .card p{font-size:14px;color:#aebac1;line-height:1.8}
  .code{font-size:36px;letter-spacing:6px;text-align:center;background:#00a884;padding:15px;border-radius:10px;margin:12px 0;font-weight:bold}
  button{width:100%;padding:14px;border:none;border-radius:10px;background:#00a884;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px}
  button.red{background:#e74c3c}
  button.sec{background:#2a3942}
  .item{background:#2a3942;padding:12px;border-radius:10px;margin-bottom:10px;cursor:pointer}
  .item b{color:#fff}
  .item span{font-size:12px;color:#ffd166}
</style>
</head>
<body>
<div class="app">
  <h2 style="text-align:center">👑 لوحة المدير</h2>
  <p style="text-align:center;color:#8696a0;font-size:13px">المدير: 771713275</p>

  <div id="تفاصيل" class="card" style="display:none">
    <h3>طلب دخول جديد</h3>
    <p>رقم المستخدم: <b id="رقم_المستخدم">-</b><br>الحالة: <b id="حالة_الطلب">-</b><br>الوقت: <span id="وقت_الطلب">-</span></p>
    <div class="code" id="الرمز">------</div>
    <button onclick="موافقة()">✅ تأكيد الدخول - يظهر الرمز عنده</button>
    <button class="red" onclick="رفض()">❌ رفض الطلب</button>
    <button class="sec" onclick="location.href='index.html'">رجوع</button>
  </div>

  <div class="card">
    <h3>كل الطلبات المعلقة</h3>
    <div id="القائمة"><p style="text-align:center;color:#8696a0">جاري التحميل...</p></div>
    <button class="sec" onclick="location.reload()">تحديث القائمة 🔄</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "ضع_API_KEY_هنا",
  authDomain: "ضع_AUTH_DOMAIN_هنا",
  databaseURL: "ضع_DATABASE_URL_هنا",
  projectId: "ضع_PROJECT_ID_هنا",
  storageBucket: "ضع_STORAGE_هنا",
  messagingSenderId: "ضع_SENDER_ID_هنا",
  appId: "ضع_APP_ID_هنا"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const params = new URLSearchParams(location.search);
let id_الحالي = params.get("id");

function عرض_طلب(id, data) {
  id_الحالي = id;
  document.getElementById("تفاصيل").style.display = "block";
  document.getElementById("رقم_المستخدم").innerText = data.phone;
  document.getElementById("حالة_الطلب").innerText = data.status === "pending" ? "بانتظار" : data.status;
  document.getElementById("وقت_الطلب").innerText = new Date(data.createdAt).toLocaleString("ar");
  document.getElementById("الرمز").innerText = data.code;
  window.scrollTo({top:0, behavior:"smooth"});
}

window.موافقة = async function() {
  if (!id_الحالي) return;
  await update(ref(db, "طلبات_دخول/" + id_الحالي), { status: "approved" });
  alert("تم التأكيد ✅ الرمز ظهر الآن عند المستخدم في نفس الشاشة");
  document.getElementById("حالة_الطلب").innerText = "approved";
};
window.رفض = async function() {
  if (!id_الحالي) return;
  await update(ref(db, "طلبات_دخول/" + id_الحالي), { status: "rejected" });
  alert("تم الرفض ❌");
};

onValue(ref(db, "طلبات_دخول"), (snap) => {
  const all = snap.val();
  const قائمة = document.getElementById("القائمة");
  if (!all) { قائمة.innerHTML = "<p style='text-align:center'>لا توجد طلبات</p>"; return; }
  قائمة.innerHTML = "";
  Object.entries(all).reverse().forEach(([id, data]) => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `<b>${data.phone}</b> - <span>${data.status}</span><br><small>الرمز: ${data.code} - اضغط لعرضه</small>`;
    div.onclick = () => عرض_طلب(id, data);
    قائمة.appendChild(div);
    if (id === params.get("id")) عرض_طلب(id, data);
  });
});
</script>
</body>
</html>
